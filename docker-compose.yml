# Local use: docker compose up -d --build  ->  http://localhost:3000
name: togisumasu
services:
  app:
    build: .
    image: togisumasu:latest
    container_name: togisumasu
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the app reach Ollama running on the host
    volumes:
      - data:/data

volumes:
  data:
