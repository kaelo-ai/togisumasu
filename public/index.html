<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Togisumasu · Math &amp; Stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%A0%94%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('togisumasu-theme');document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<style>
/* Layout: one reading column (max 58rem); home = today panel + course map list; practice = a single question card on graph-paper */
:root{
  /* light: traditional black on white; colour only where it carries meaning (correct, wrong, due) */
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#5E5E5E; --line:#D6D6D6; --grid:#F1F1F1;
  --accent:#111111; --accent-ink:#FFFFFF; --accent-soft:#EDEDED; --mark:#E0A800; --mark-soft:#FBF1D0;
  --good:#1C7F52; --good-soft:#E1F3EA; --bad:#B8362D; --bad-soft:#F9E5E3;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  /* washi paper surfaces */
  --paper:#F7F0E1; --paper-ink:#211B14; --paper-muted:#6D6252; --paper-line:#D9C8A9;
  --paper-soft:#EFE4CE; --paper-input:#FCF8EE; --seal:#A33A2B;
  --paper-shadow:0 26px 60px -38px rgba(67,47,20,.55);
  --washi-blend:multiply;
  --washi-fiber:
    radial-gradient(120% 90% at 18% 8%, rgba(255,255,255,.18), transparent 58%),
    radial-gradient(90% 80% at 82% 92%, rgba(82,61,34,.035), transparent 62%),
    repeating-linear-gradient(112deg, rgba(82,61,34,.022) 0 1px, transparent 1px 17px),
    repeating-linear-gradient(23deg, rgba(255,255,255,.07) 0 1px, transparent 1px 23px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --ink:#E5EAF1; --muted:#97A3B5; --line:#2A3441; --grid:#1D2531;
  --accent:#8AA2FF; --accent-ink:#0E131A; --accent-soft:#1F2A4A; --mark:#E5B73A; --mark-soft:#3A3219;
  --good:#52C790; --good-soft:#15332A; --bad:#F2786D; --bad-soft:#3B1D1C; color-scheme:dark;
  --paper:#1C1813; --paper-ink:#ECE1CD; --paper-muted:#B7A78D; --paper-line:#403628;
  --paper-soft:#272118; --paper-input:#15110D; --seal:#D87560;
  --paper-shadow:0 26px 60px -34px rgba(0,0,0,.8); --washi-blend:soft-light;}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E5EAF1; --muted:#97A3B5; --line:#2A3441; --grid:#1D2531;
  --accent:#8AA2FF; --accent-ink:#0E131A; --accent-soft:#1F2A4A; --mark:#E5B73A; --mark-soft:#3A3219;
  --good:#52C790; --good-soft:#15332A; --bad:#F2786D; --bad-soft:#3B1D1C; color-scheme:dark;
  --paper:#1C1813; --paper-ink:#ECE1CD; --paper-muted:#B7A78D; --paper-line:#403628;
  --paper-soft:#272118; --paper-input:#15110D; --seal:#D87560;
  --paper-shadow:0 26px 60px -34px rgba(0,0,0,.8); --washi-blend:soft-light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:0 0 8px 8px;font-weight:600;text-decoration:none}
.skip:focus{top:0}
.wrap{max-width:58rem;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--grid);padding:.05em .35em;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:58rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand-sub{font-family:var(--f-body);font-size:.72rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
@media (max-width:600px){.brand-sub{display:none}}
.brand .glyph{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:.95rem}
.stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:.86rem;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}
.xpbar{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:var(--accent)}

/* home */
.today{margin-top:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:680px){.today{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.today h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:6px 0 10px;letter-spacing:-.02em}
.today p{margin:0 0 16px;color:var(--muted);max-width:40ch}
.today p b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1;letter-spacing:-.03em}
.meter{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--good)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem;margin-top:14px}
.kv span:nth-child(odd){color:var(--muted)}

.map{margin-top:36px;display:grid;gap:28px}
.unit h2{font-size:1.2rem;display:flex;align-items:center;margin:0}
.unit-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.unit-head:hover .ul{color:var(--seal,var(--accent))}
.unit-head .ul{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.unit-head .ct{margin-left:auto;font-family:var(--f-body);font-size:.82rem;color:var(--muted);font-weight:500}
.unit-head .chev{color:var(--muted);font-size:.9rem;transition:transform .18s ease;line-height:1}
.unit.is-collapsed .unit-head .chev{transform:rotate(-90deg)}
.unit.is-collapsed .skills{display:none}
.uring{width:20px;height:20px;border-radius:50%;display:inline-block;background:conic-gradient(var(--good) calc(var(--p) * 1%),var(--line) 0);position:relative;flex:none}
.uring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.skills{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.skills li+li{border-top:1px solid var(--line)}
.sk{width:100%;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;padding:11px 14px;background:none;border:0;text-align:left;cursor:pointer}
.sk:hover{background:var(--grid)}
.sk .nm{font-weight:500;min-width:0}
.sk .mt{font-size:.8rem;color:var(--muted);white-space:nowrap}
.sk .mt.due{color:var(--ink);background:var(--mark-soft);padding:2px 8px;border-radius:99px}
.sk .mt.rec{color:var(--accent);font-weight:600}
.dot{width:18px;height:18px;border-radius:50%;display:block}
.dot.new{border:2px solid var(--line)}
.dot.mastered{background:var(--good)}
.dot.due{background:var(--mark)}
.lv{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.lv i{width:5px;height:10px;border-radius:1px;background:var(--line)}
.lv i.on{background:var(--good)}

/* skill page */
.crumb{margin-top:20px}
.shead{margin-top:10px;display:grid;gap:8px}
.shead h1{font-size:clamp(1.7rem,4.4vw,2.4rem);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--grid);color:var(--muted);width:max-content}
.pill.mastered{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--mark-soft);color:var(--ink)}
.pill.learning{background:var(--accent-soft);color:var(--accent)}
.srcs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.src{display:inline-flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:.88rem;line-height:1.3}
.src small{color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.src:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.notes{max-width:65ch;margin-top:18px}
.notes p,.notes ul{margin:0 0 12px}
.notes mjx-container[display="true"]{margin:14px 0!important}
.example{margin-top:22px}
.example h3{font-size:1.02rem;margin-bottom:8px}

/* question card */
.qcard{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:clip;scroll-margin-top:84px}
.qcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 55%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 55%)}
.qcard>*{position:relative}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.qmeta .tag{font-weight:600;color:var(--accent)}
.qmeta .tag.rev{color:var(--ink);background:var(--mark-soft);padding:1px 8px;border-radius:99px}
.prompt{font-size:1.06rem;min-width:0;overflow-x:auto}
.prompt p{margin:0}
.prompt .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
.prompt mjx-container[display="true"]{margin:12px 0!important;overflow-x:auto;overflow-y:hidden}
.fig{display:block;width:100%;max-width:300px;margin:10px 0;color:var(--ink)}
.fig .fl{font:600 15px var(--f-mono);fill:var(--ink)}
.answer{margin-top:14px;display:grid;gap:8px}
.answer label.l{font-size:.8rem;font-weight:600;color:var(--muted)}
.mathin{width:100%;font:500 1.05rem var(--f-mono);padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mathin:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.mathin.ok{border-color:var(--good);background:var(--good-soft)}
.mathin.no{border-color:var(--bad);background:var(--bad-soft)}
.preview{min-height:28px;color:var(--muted);font-size:.95rem}
.preview .pe{font-size:.84rem;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field .fl{font-size:.9rem;color:var(--muted)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{font:500 .9rem var(--f-mono);min-width:40px;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.key:hover{border-color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;min-width:0;overflow-x:auto}
.opt .k{font:600 .8rem var(--f-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:5px;background:var(--grid);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.actions{margin-top:14px}
details.help{font-size:.84rem;color:var(--muted)}
details.help summary{cursor:pointer;width:max-content}
details.help ul{margin:6px 0 0;padding-left:18px}
.hintbox{margin-top:12px;padding:10px 14px;border-left:3px solid var(--mark);background:var(--mark-soft);border-radius:0 8px 8px 0}
.feedback{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;scroll-margin-top:84px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.verdict .xp{font:600 .8rem var(--f-body);color:var(--muted)}
.warn{color:var(--bad);font-size:.9rem}
.ansline{margin:8px 0}
.steps{margin:8px 0 0;padding-left:22px;display:grid;gap:6px}
.feedback details summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:8px;width:max-content}
.aibox{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.aibox .ailabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.aibox p{margin:6px 0}.aibox .aimeta{font-size:12px;color:var(--muted);margin-top:8px}
.event{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--good-soft);color:var(--good);font-weight:600}
.event.miss{background:var(--mark-soft);color:var(--ink)}
.streakdots{display:inline-flex;gap:4px;margin-left:auto}
.streakdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--good)}
.streakdots i.on{background:var(--good)}
.newtopic{margin-bottom:12px;padding:12px 14px;background:var(--accent-soft);border-radius:8px}
.newtopic summary{cursor:pointer;font-weight:600;color:var(--accent)}
.newtopic .notes{margin-top:10px}

/* session */
.sbar{margin-top:22px;display:flex;align-items:center;gap:12px}
.sbar .meter{flex:1;margin:0}
.sbar .meter i{background:var(--accent)}
.summary{margin-top:28px}
.summary h1{font-size:2rem;margin:6px 0 12px}
.summary ul{padding-left:18px}

.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot .sp{margin-left:auto}
.confirm{display:inline-flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.verdict{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}

/* graph view */
:root{--edge:#BDBDBD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--edge:#3A4656}}
:root[data-theme="dark"]{--edge:#3A4656}
.maphead{margin-top:36px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.maphead h2{font-size:1.2rem}
.map-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map-tools .seg{margin-left:0}
.mapselect{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:.84rem;min-height:34px}
.map-empty{margin-top:10px;padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.seg{margin-left:auto;display:inline-flex;background:var(--grid);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:6px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.maphead+.map{margin-top:14px}
.graph{margin-top:12px;display:grid;gap:12px}
.gintro{margin:0;color:var(--muted);font-size:.9rem;max-width:65ch}
.uchips{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){.uchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.uchip{flex:none}}
.uchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px 4px 5px;font-size:.82rem;cursor:pointer}
.uchip b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--grid);font:600 .72rem var(--f-mono);color:var(--accent)}
.uchip span{color:var(--muted)}
.uchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gframe{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gscroll{overflow:auto;max-height:min(72vh,640px);cursor:grab;background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:18px 18px;overscroll-behavior:contain}
.gscroll.grab{cursor:grabbing;user-select:none}
.gscroll svg{display:block}
.gtools{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:4px}
.gtools .key{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.gscroll svg{margin-top:0}.gcol{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .15s}
.edge.up{stroke:var(--accent);stroke-width:2.2}
.edge.down{stroke:var(--mark);stroke-width:2.2}
.edge.dim{opacity:.2}
.node{cursor:pointer;transition:opacity .15s}
.node.dim{opacity:.42}
.node .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node .lbl{font:500 12.5px var(--f-body);fill:var(--ink)}
.node .ul{font:600 12px var(--f-mono);fill:var(--muted)}
.node .sep{stroke:var(--line)}
.node .prog{fill:var(--accent)}
.node.mastered .box{fill:var(--good-soft);stroke:var(--good)}
.node.mastered .ul{fill:var(--good)}
.node.due .box{fill:var(--mark-soft);stroke:var(--mark)}
.node.learning .box{stroke:var(--accent)}
.node.next .box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.node.next .ul{fill:var(--accent)}
.node.open .box{stroke:var(--muted)}
.node.locked .box{fill:var(--bg);stroke-dasharray:4 3}
.node.locked .lbl{fill:var(--muted)}
.nexttag{font:700 10px var(--f-body);letter-spacing:.08em;fill:var(--accent)}
.node:hover .box{stroke-width:2.5}
.node.sel .box{stroke:var(--ink);stroke-width:3}
.node:focus{outline:none}.node:focus-visible .box{stroke:var(--accent);stroke-width:3}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:18px;height:12px;border-radius:3px;border:1.5px solid var(--line);background:var(--surface);display:inline-block}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mjChain=Promise.resolve();
window.typeset=function(el){if(!el)return;if(window.__mjq){window.__mjq.push(el);return}
  mjChain=mjChain.then(()=>{try{MathJax.typesetClear([el])}catch(e){}return MathJax.typesetPromise([el])}).catch(()=>{})};
const DAY=864e5,INT=[0,1,3,7,16,35,70],GOAL=20,KEY='togisumasu-progress-v1';
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- progress store: your account on this server; a per-account cache on this device for offline use ---------- */
const API={async req(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong. Try again.'),{status:r.status});return j}};
let USER=null;
const BUILTIN_GENS={};SK.forEach(s=>{if(typeof s.gen==='function')BUILTIN_GENS[s.id]=s.gen});
let CATALOG_LOADED=false;
function applyCatalog(c){const units=Array.isArray(c.units)?c.units:[],topics=Array.isArray(c.topics)?c.topics:[];
  UNITS.length=0;UNITS.push(...units.map(u=>[u.id,u.name]));
  SK.length=0;
  for(const t of topics)SK.push({...t,gen:BUILTIN_GENS[t.id]});

  rebuildGraph()}
async function loadCatalog(){if(CATALOG_LOADED)return;try{const r=await API.req('GET','/api/catalog');applyCatalog(r);CATALOG_LOADED=true}catch(e){console.warn('Could not load the topic catalog; using built-ins.',e.message)}}
const EMPTY=()=>({skills:{},log:{},t:0,qz:{recent:[],last:0,hist:[]},seen:{},resetAt:0});
const Store={data:EMPTY(),mode:'account',timer:null,dirty:false,
  key(){return KEY+':'+(USER?USER.id:'none')},
  readCache(){try{const s=localStorage.getItem(this.key());if(s){const d=JSON.parse(s);if(d&&d.skills)return d}}catch(e){}return null},
  cache(){try{localStorage.setItem(this.key(),JSON.stringify(this.data))}catch(e){}},
  async load(){this.data=this.readCache()||EMPTY();
    try{const r=await API.req('GET','/api/progress');const srv=r.data;

/* ---------- theme: black-and-white light, or dark ---------- */
const THEME_KEY='togisumasu-theme';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function currentTheme(){let t=null;try{t=localStorage.getItem(THEME_KEY)}catch(e){}return t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyTheme(t){document.documentElement.dataset.theme=t;const b=$('#themeBtn');if(!b)return;
  const next=t==='dark'?'light':'dark';b.innerHTML=t==='dark'?ICON_SUN:ICON_MOON;b.setAttribute('aria-label',`Switch to ${next} mode`);b.title=`Switch to ${next} mode`}
$('#themeBtn').onclick=()=>{const t=currentTheme()==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,t)}catch(e){}applyTheme(t)};
applyTheme(currentTheme());

const st=id=>Store.data.skills[id]||{a:0,c:0,s:0,lv:0,due:0};
const Q=()=>(Store.data.qz=Store.data.qz||{recent:[],last:0,hist:[]});
const isDue=id=>{const s=st(id);return s.lv>0&&!s.fix&&s.due<=Date.now()};
const needsRepair=id=>!!st(id).fix;
const repairList=()=>SK.filter(s=>needsRepair(s.id));
const unlocked=id=>SKM[id].pre.every(p=>st(p).lv>0);
const stateOf=id=>{const s=st(id);return s.fix?'repair':isDue(id)?'due':s.lv>0?'mastered':s.a>0?'learning':'new'};
const masteredIds=()=>SK.filter(s=>st(s.id).lv>0&&!st(s.id).fix).map(s=>s.id);
const QUIZ_MIN=3;
function quizDue(){const q=Q();return masteredIds().length>=QUIZ_MIN&&(q.recent.length>=2||(q.recent.length>=1&&Date.now()-q.last>4*DAY))}
/* can this topic be practised right now? */
/* everything a topic builds on, directly or indirectly */
const ANC={};function ancestors(id){if(ANC[id])return ANC[id];const out=new Set();const u=x=>{const s=SKM[x];if(!s)return;s.pre.forEach(p=>{if(!out.has(p)){out.add(p);u(p)}})};u(id);return ANC[id]=out}
/* only its own route can hold a topic back: missing prerequisites, a repair or an untested topic somewhere underneath it */
function access(id){const s=st(id);if(s.lv>0||s.fix)return {ok:true};
  const miss=SKM[id].pre.filter(p=>st(p).lv===0);if(miss.length)return {ok:false,why:'pre',miss};
  const A=ancestors(id);const rep=repairList().map(x=>x.id).filter(r=>A.has(r));if(rep.length)return {ok:false,why:'repair',rep};
  if(quizDue()){const on=Q().recent.filter(r=>A.has(r));if(on.length)return {ok:false,why:'quiz',on}}
  return {ok:true}}
/* never-seen-before questions: fingerprints of every prompt shown, sourced from the server-side bank */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
const QCACHE='togisumasu-question-cache-v1';
function readQCache(){try{const c=JSON.parse(localStorage.getItem(QCACHE)||'{}');return c&&typeof c==='object'?c:{}}catch(e){return {}}}
function cachedQuestions(id){const c=readQCache();return Array.isArray(c[id])?c[id]:[]}
function cacheQuestion(id,q){if(!q||!q.prompt)return;try{const c=readQCache();const list=c[id]=Array.isArray(c[id])?c[id]:[];
  if(!list.some(x=>x.fingerprint===q.fingerprint||(q.id!=null&&x.id===q.id))){list.push(q);if(list.length>12)list.shift()}
  localStorage.setItem(QCACHE,JSON.stringify(c))}catch(e){}}
async function fetchQuestion(id,exclude){const p=new URLSearchParams({skill:id});if(exclude.length)p.set('exclude',exclude.slice(-150).join(','));
  const r=await API.req('GET','/api/questions/next?'+p.toString());return r.question}
const networkFailure=e=>!e||!e.status||e.status>=500;
async function loadFresh(id){const S=Store.data.seen=Store.data.seen||{};const a=S[id]=S[id]||[];let q=null,h=null;
  try{q=await fetchQuestion(id,a);if(q)h=q.fingerprint||hash(q.prompt)}catch(e){if(!networkFailure(e))throw e}
  if(!q){const cached=cachedQuestions(id).filter(x=>!a.includes(x.fingerprint));if(cached.length)q=cached[Math.floor(Math.random()*cached.length)];else if(SKM[id]&&typeof SKM[id].gen==='function')q=SKM[id].gen();else throw new Error('No questions are available for this topic yet.');h=q.fingerprint||hash(q.prompt)}
  if(h&&!a.includes(h)){a.push(h);if(a.length>150)a.splice(0,a.length-150)}
  if(q&&!q.fingerprint&&h)q.fingerprint=h;
  cacheQuestion(id,q);return q}
const freshChains={};
function fresh(id){const prev=freshChains[id]||Promise.resolve();const p=prev.catch(()=>{}).then(()=>loadFresh(id));freshChains[id]=p;return p}
async function exampleQuestion(id){try{const q=await fetchQuestion(id,[]);cacheQuestion(id,q);return q}catch(e){if(!networkFailure(e))throw e;const c=cachedQuestions(id);if(c.length)return c[Math.floor(Math.random()*c.length)];if(SKM[id]&&typeof SKM[id].gen==='function')return SKM[id].gen();throw new Error('No example is available for this topic yet.')}}
function record(id,ok,mode){const s={...st(id)},now=Date.now();let ev=null;s.a++;
  if(ok){s.c++;Store.data.log[dkey()]=(Store.data.log[dkey()]||0)+1}
  if(mode==='quiz')s.lq=now;
  if(s.fix&&mode==='quiz'){}
  else if(s.fix){if(ok){s.s=(s.s||0)+1;if(s.s>=2){delete s.fix;s.s=0;s.lv=Math.max(1,s.lv);s.due=now+DAY;ev={k:'repaired'}}else ev={k:'repairing',n:s.s}}else{s.s=0;ev={k:'repairing',n:0}}}
  else if(s.lv===0){if(ok){s.s++;if(s.s>=3){s.lv=1;s.s=0;s.due=now+DAY;ev={k:'mastered'};const R=Q().recent;if(!R.includes(id))R.push(id)}}else s.s=0}
  else if(mode==='quiz'){if(ok){if(s.due<=now){s.lv=Math.min(6,s.lv+1);s.due=now+INT[s.lv]*DAY}}else{s.fix=1;s.s=0;s.lv=1;s.due=now}}
  else if(s.due<=now){if(ok){s.lv=Math.min(6,s.lv+1);s.due=now+INT[s.lv]*DAY;ev={k:'reviewed',d:INT[s.lv]}}else{s.fix=1;s.s=0;s.lv=Math.max(1,s.lv-1);s.due=now;ev={k:'failedReview'}}}
  else if(!ok){s.due=Math.min(s.due,now+DAY);ev={k:'pulled'}}
  s.last=now;Store.data.skills[id]=s;Store.save();renderStats();return ev}
function recommended(skip=[]){const c=SK.filter(s=>!skip.includes(s.id)&&st(s.id).lv===0&&!st(s.id).fix&&access(s.id).ok);return c.find(s=>st(s.id).a>0)||c[0]||null}
function dayStreak(){const L=Store.data.log;let n=0,t=Date.now();if(!L[dkey(t)])t-=DAY;while(L[dkey(t)]){n++;t-=DAY}return n}
const masteredCount=()=>SK.filter(s=>st(s.id).lv>0).length;
const dueList=()=>SK.filter(s=>isDue(s.id)).sort((a,b)=>st(a.id).due-st(b.id).due);

function renderStats(){renderAcct();if(!USER){$('#stats').innerHTML='';return}const x=Store.data.log[dkey()]||0;$('#stats').innerHTML=`<span>Streak <b>${dayStreak()}</b> day${dayStreak()===1?'':'s'}</span><span>Today <b>${x}</b>/${GOAL} <span class="xpbar"><i style="width:${Math.min(100,x/GOAL*100)}%"></i></span></span>`}

function renderAcct(){const a=$('#acct');if(!a)return;
  if(!USER){a.innerHTML=view.name==='landing'?`<button class="btn ghost sm" type="button" data-auth="login">Sign in</button>${REG_OPEN?'<button class="btn primary sm" type="button" data-auth="register">Create account</button>':''}`:'';return}

function go(v){if(!USER&&v.name!=='auth'&&v.name!=='landing')v={name:'landing'};view=v;render();window.scrollTo(0,0)}
function render(){renderStats();const app=$('#app');
  if(view.name==='auth'){app.innerHTML=authHTML(view);const f=$('#authForm input');if(f)f.focus();return}
  if(view.name==='landing'){app.innerHTML=landingHTML();typeset(app);return}

  else if(view.name==='skill')app.innerHTML=skillHTML(view.id,view.tab);
  else if(view.name==='session')app.innerHTML=`<div id="sessHost"></div>`;
  else if(view.name==='quiz')app.innerHTML=`<div id="quizHost"></div>`;
  app.insertAdjacentHTML('beforeend','<footer class="foot" id="foot"></footer>');renderFoot();

function renderFoot(){const f=$('#foot');if(!f)return;
  f.innerHTML=`<span>${Store.mode==='account'?'Progress saved to your account':'Offline: saving on this device; it syncs when you reconnect'}</span><span>Notes: <a href="https://tutorial.math.lamar.edu/" target="_blank" rel="noopener">Paul's Online Notes</a> · extra problems: <a href="https://openstax.org/details/books/precalculus-2e" target="_blank" rel="noopener">OpenStax Precalculus 2e</a></span><span class="sp" id="resetZone"><button class="btn ghost sm" id="resetBtn" type="button">Reset progress</button></span>`}

function homeHTML(){const due=dueList(),rec=recommended(),m=masteredCount(),rep=repairList(),qd=quizDue();
  const tasks=[];rep.forEach(s=>tasks.push(`<li class="t-repair"><span class="tk">Repair</span>${esc(s.name)}</li>`));
  if(qd)tasks.push(`<li class="t-quiz"><span class="tk">Quiz</span>${Math.min(8,Math.max(5,masteredIds().length))} questions across your mastered topics</li>`);

  if(!tasks.length)tasks.push('<li class="t-new"><span class="tk">Mixed</span>Everything is mastered. Sessions keep all topics sharp.</li>');

  const acc=Object.values(Store.data.skills).reduce((a,s)=>[a[0]+s.c,a[1]+s.a],[0,0]);const lastQ=Q().hist.slice(-1)[0];const totalTopics=Math.max(1,SK.length);
  const filterSelect=homeMode==='list'?`<label class="mapfilter"><span class="sr-only">Filter course map</span><select id="mapFilter" class="mapselect">${MAP_FILTERS.map(([v,l])=>`<option value="${v}"${mapFilter===v?' selected':''}>${l}</option>`).join('')}</select></label>`:'';

   <div class="panel"><div class="eyebrow">Course progress</div><div class="row" style="margin-top:10px;align-items:baseline"><span class="big tnum">${m}</span><span style="color:var(--muted)">of ${SK.length} topics mastered</span></div>
   <div class="meter"><i style="width:${m/totalTopics*100}%"></i></div>
   <div class="kv tnum"><span>Questions answered</span><span>${acc[1]}</span><span>Accuracy</span><span>${acc[1]?Math.round(acc[0]/acc[1]*100)+'%':'–'}</span><span>Last quiz</span><span>${lastQ?`${lastQ.score}/${lastQ.n}`:'–'}</span><span>Day streak</span><span>${dayStreak()}</span></div></div></section>
   <div class="maphead"><h2>Course map</h2><div class="map-tools">${filterSelect}<div class="seg" role="tablist" aria-label="Course map view"><button type="button" role="tab" data-mode="list" aria-selected="${homeMode!=='graph'}">List</button><button type="button" role="tab" data-mode="graph" aria-selected="${homeMode==='graph'}">Graph</button></div></div></div>`;
  if(homeMode==='graph')return h+graphShellHTML();
  const matches=s=>{const k=mapSkillState(s.id);return mapFilter==='all'||(mapFilter==='progress'&&(k==='learning'||k==='repair'))||(mapFilter==='due'&&k==='due')||(mapFilter==='mastered'&&k==='mastered')||(mapFilter==='locked'&&k==='locked')};
  let any=false;h+=`<section class="map">`;
  for(const [u,un] of UNITS){const allList=SK.filter(s=>s.unit===u);const list=allList.filter(matches);if(!list.length)continue;any=true;
    const um=allList.filter(s=>st(s.id).lv>0).length;const pct=Math.round(um/allList.length*100);const collapsed=collapsedUnits.has(u);
    h+=`<div class="unit${collapsed?' is-collapsed':''}"><h2><button class="unit-head" type="button" data-unit-toggle="${u}" aria-expanded="${!collapsed}" aria-controls="unit-${u}"><span class="ul">${u}</span><span>${esc(un)}</span><span class="ct tnum">${um}/${allList.length}</span><span class="uring" style="--p:${pct}" role="img" aria-label="${um} of ${allList.length} topics mastered"></span><span class="chev" aria-hidden="true">▾</span></button></h2><ul class="skills" id="unit-${u}">`;
    for(const s of list){const k=mapSkillState(s.id);const x=st(s.id);let meta='';
      if(k==='repair')meta=`<span class="mt repair">Needs repair</span>`;else if(k==='due')meta=`<span class="mt due">Review due</span>`;else if(k==='mastered')meta=`<span class="mt">Mastered<span class="lv">${[1,2,3,4,5,6].map(i=>`<i class="${i<=x.lv?'on':''}"></i>`).join('')}</span></span>`;
      else if(rec&&rec.id===s.id)meta=`<span class="mt rec">Up next</span>`;else if(k==='learning')meta=`<span class="mt">${x.s}/3 in a row</span>`;else if(k==='locked')meta=`<span class="mt">Locked</span>`;
      const dot=k==='learning'?`<svg class="dot" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="${Math.min(3,x.s)/3*50.3} 60" transform="rotate(-90 10 10)"/></svg>`:`<span class="dot ${k}"></span>`;
      h+=`<li><button class="sk${k==='locked'?' is-locked':''}" type="button" data-skill="${s.id}">${dot}<span class="nm">${esc(s.name)}</span>${meta}</button></li>`}
    h+='</ul></div>'}
  if(!any)h+=`<div class="map-empty">No topics match this filter yet.</div>`;
  return h+'</section>'}

function srcLinks(s){const links=[];if(s.paul)links.push(`<a class="src" href="${s.paul}" target="_blank" rel="noopener"><small>Read</small>Paul's Online Notes</a>`);if(Array.isArray(s.os)&&s.os[1])links.push(`<a class="src" href="${s.os[1]}" target="_blank" rel="noopener"><small>More problems</small>${esc(s.os[0]||'OpenStax')}</a>`);return links.length?`<div class="srcs">${links.join('')}</div>`:''}
function pillOf(id){let k=stateOf(id);const x=st(id);if((k==='new'||k==='learning')&&!access(id).ok)k='locked';
  return {new:'<span class="pill">Not started</span>',locked:'<span class="pill">Locked</span>',learning:`<span class="pill learning">Learning · ${x.s}/3 in a row</span>`,mastered:`<span class="pill mastered">Mastered · review level ${x.lv}</span>`,due:'<span class="pill due">Review due</span>',repair:`<span class="pill repair">Needs repair · ${x.s||0}/2 in a row</span>`}[k]}
function skillHTML(id,tab){const s=SKM[id];const un=UNITS.find(u=>u[0]===s.unit)[1];
  const pre=s.pre.length?`<p style="color:var(--muted);font-size:.88rem;margin:4px 0 0">Builds on: ${s.pre.map(p=>`<a href="#" data-skill="${p}">${esc(SKM[p].name)}</a>${st(p).lv>0?' ✓':''}`).join(', ')}</p>`:'';
  return `<div class="crumb"><button class="btn ghost sm" type="button" data-act="home">← Course map</button></div>
  <div class="shead"><div class="eyebrow">Unit ${s.unit} · ${esc(un)}</div><h1>${esc(s.name)}</h1><span id="pill">${pillOf(id)}</span>${pre}${srcLinks(s)}</div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${tab==='learn'}" data-tab="learn" type="button">Learn</button><button class="tab" role="tab" aria-selected="${tab==='practice'}" data-tab="practice" type="button">Practice</button></div>
  ${tab==='learn'?`<div class="notes washi-paper">${s.notes||'<p class="muted">No notes have been written for this topic yet.</p>'}</div><div class="example"><h3>Worked example</h3><div id="exHost"></div><div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="another">Another example</button><button class="btn primary" type="button" data-tab="practice">Practice this topic</button></div></div>`:'<div id="pHost"></div>'}`}

async function mountExample(){const s=SKM[view.id],host=$('#exHost');if(!host)return;
  host.innerHTML='<div class="boot">Loading example…</div>';
  let q;try{q=await exampleQuestion(s.id)}catch(e){host.innerHTML=`<p class="warn">Could not load an example. ${esc(e.message)}</p>`;return}

  host.innerHTML=`<article class="qcard washi-paper"><div class="prompt">${q.prompt}</div><div class="feedback"><div class="ansline"><b>Answer:</b> ${ansDisplay(q)}</div><ol class="steps">${q.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></article>`;typeset(host)}
function ansDisplay(q){if(q.type==='mc'){const o=q.options.find(o=>o.ok);return o.tex}
  if(q.type==='fields')return q.fields.map(f=>`$${f.label}=${f.ansTex!=null?f.ansTex:f.ans}$`).join(', ');return `$${q.ansTex}$`}
function lockHTML(id,a){if(a.why==='pre')return `<div class="lock"><div class="eyebrow">Locked</div><h3>Master the prerequisites first</h3><p>This topic builds on ${a.miss.map(p=>`<b>${esc(SKM[p].name)}</b>`).join(' and ')}. Practice opens as soon as ${a.miss.length>1?'they are':'it is'} mastered. You can read the Learn tab any time.</p><div class="row">${a.miss.map(p=>`<button class="btn${p===a.miss[0]?' primary':''}" type="button" data-skill="${p}">Go to ${esc(SKM[p].name)}</button>`).join('')}</div></div>`;
  if(a.why==='repair')return `<div class="lock repair"><div class="eyebrow">Repair first</div><h3>Something this builds on has slipped</h3><p>${a.rep.map(p=>`<b>${esc(SKM[p].name)}</b>`).join(', ')} ${a.rep.length>1?'need':'needs'} repair. Get 2 in a row, then this topic opens. Topics on other routes stay open.</p><div class="row">${a.rep.map((p,i)=>`<button class="btn${i?'':' primary'}" type="button" data-skill="${p}">Repair ${esc(SKM[p].name)}</button>`).join('')}</div></div>`;
  return `<div class="lock"><div class="eyebrow">Quiz waiting</div><h3>Confirm what this builds on first</h3><p>This topic builds on ${a.on.map(p=>`<b>${esc(SKM[p].name)}</b>`).join(' and ')}, which you mastered since your last quiz. Take the quiz to check it has stuck. Topics on other routes stay open.</p><div class="row"><button class="btn primary" type="button" data-act="quiz">Take the quiz</button></div></div>`}
async function mountPractice(){const s=SKM[view.id];const a=access(s.id);if(!a.ok){$('#pHost').innerHTML=lockHTML(s.id,a);return}
  const host=$('#pHost');if(!host)return;host.innerHTML='<div class="boot">Loading question…</div>';
  let q;try{q=await fresh(s.id)}catch(e){host.innerHTML=`<p class="warn">Could not load a question. ${esc(e.message)}</p>`;return}
  if(!host.isConnected)return;
  const x=st(s.id);const rep=!!x.fix;const need=rep?2:3;
  mountQuestion(host,q,{meta:()=>`<span class="tag${rep?' rep':''}">${rep?'Repair':'Practice'}</span><span>${rep?'Get 2 in a row to repair this topic':x.lv>0?(isDue(s.id)?'This counts as your review':'Extra practice'):'Get 3 in a row to master this topic'}</span>${x.lv>0&&!rep?'':`<span class="streakdots">${Array.from({length:need},(_,i)=>`<i class="${i<Math.min(need,x.s||0)?'on':''}"></i>`).join('')}</span>`}`,
    answered:ok=>{const ev=record(s.id,ok,'practice');$('#pill').innerHTML=pillOf(s.id);return ev},next:()=>mountPractice()})}

/* ---------- question card ---------- */
const PH={num:'e.g. 3/4, -2, sqrt(3)/2, 5pi/6',set:'e.g. -2, 5   (or none)',expr:'e.g. 2x^2 - 3x + 1'};
const EVT={mastered:()=>'<div class="event">Topic mastered. It will come back for review tomorrow and in quizzes.</div>',reviewed:e=>`<div class="event">Review passed. Next review in ${e.d} days.</div>`,
  failedReview:()=>'<div class="event bad">Review missed. This topic now needs repair: 2 in a row before you move on.</div>',repaired:()=>'<div class="event">Repaired. This topic is back on your review schedule.</div>',
  repairing:e=>`<div class="event ${e.n?'':'miss'}">Repair: ${e.n}/2 in a row.</div>`,pulled:()=>'<div class="event miss">Missed. This topic comes back for review tomorrow.</div>'};
let activeQ=null;
function givenText(q,inp){if(inp==null)return '<em>Skipped</em>';if(q.type==='mc')return q.options[inp].tex;
  if(q.type==='fields')return q.fields.map((f,i)=>`$${f.label}=$ <code>${esc(inp[i])}</code>`).join(', ');return `<code>${esc(inp)}</code>`}
async function similarBankQuestion(q){
  const r=await API.req('GET',`/api/questions/${q.id}/similar?limit=12`);
  const items=(r.items||[]).filter(x=>x.id!==q.id&&x.skillId===q.skillId);
  if(!items.length)return null;
  const pick=items[Math.floor(Math.random()*items.length)];
  const full=await API.req('GET','/api/questions/'+pick.id);
  return full.question;
}
function mountQuestion(host,q,ctx){let done=false,sel=null,lastIn=null;const inputs=()=>[...host.querySelectorAll('.mathin')];
  const ui=q.type==='mc'?`<div class="opts" role="group" aria-label="Choices">${q.options.map((o,i)=>`<button class="opt" type="button" aria-pressed="false" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o.tex}</span></button>`).join('')}</div>`
   :q.type==='fields'?`<div class="fields">${q.fields.map((f,i)=>`<label class="field" for="qf${i}"><span class="fl">$${f.label}=$</span><input class="mathin" id="qf${i}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></label>`).join('')}</div>${keys(true)}${help()}`
   :`<label class="l" for="qIn">Your answer</label><input class="mathin" id="qIn" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${PH[q.type]}"><div class="preview" id="qPrev" aria-live="polite"></div>${keys(q.type==='set'||q.type==='num')}${help()}`;
  const acts=ctx.test?`<button class="btn primary" type="button" id="qCheck">Submit answer</button><button class="btn ghost" type="button" id="qGive">I don't know</button>`
   :`<button class="btn primary" type="button" id="qCheck">Check</button>${q.hint?'<button class="btn ghost" type="button" id="qHint">Hint</button>':''}<button class="btn ghost" type="button" id="qGive">Show solution</button>`;
  host.innerHTML=`<article class="qcard${ctx.test?' test':''} washi-paper"><div class="qmeta">${ctx.meta()}</div>${ctx.intro||''}<div class="prompt">${q.prompt}</div><div class="answer">${ui}</div>
   <div class="hintbox" id="qHintBox" hidden>${q.hint||''}</div><div class="feedback" id="qFb" hidden></div><div class="actions row" id="qAct">${acts}</div><div class="sr-only" id="qLive" role="status" aria-live="polite"></div></article>`;
  const fb=host.querySelector('#qFb');
  host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.i;host.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  inputs().forEach(inp=>{inp.addEventListener('focus',()=>lastIn=inp);if(inp.id==='qIn'){let t;inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>preview(inp.value),220)})}});
  function preview(v){const p=host.querySelector('#qPrev');if(!p)return;if(!v.trim()){p.innerHTML='';return}
    if(q.type==='set'&&/^\s*(none|no solution)/i.test(v)){p.innerHTML='No solution';return}
    try{const parts=q.type==='set'?splitSet(v):[v];p.innerHTML='\\('+parts.map(x=>toTex(parse(x))).join(',\;')+'\\)';typeset(p)}catch(e){p.innerHTML=`<span class="pe">${esc(e.message)}</span>`}}
  host.querySelectorAll('.key').forEach(k=>k.onclick=()=>{const inp=lastIn||inputs()[0];if(!inp||done)return;const ins=k.dataset.k,s0=inp.selectionStart??inp.value.length,s1=inp.selectionEnd??s0;
    inp.value=inp.value.slice(0,s0)+ins+inp.value.slice(s1);const pos=s0+(ins.endsWith('()')?ins.length-1:ins.length);inp.focus();inp.setSelectionRange(pos,pos);inp.dispatchEvent(new Event('input'))});
  const hb=host.querySelector('#qHint');if(hb)hb.onclick=()=>{const b=host.querySelector('#qHintBox');b.hidden=false;hb.hidden=true;typeset(b)};
  function finish(ok,gaveUp,per,inp){done=true;activeQ.done=true;const card=host.querySelector('.qcard');if(card)card.classList.add('done');
    if(ctx.test){ctx.answered(ok,givenText(q,gaveUp?null:inp));ctx.next();return}
    inputs().forEach((el,i)=>{el.readOnly=true;if(!gaveUp)el.classList.add(per?(per[i]?'ok':'no'):ok?'ok':'no')});
    host.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.options[i].ok)b.classList.add('ok');else if(i===sel)b.classList.add('no')});
    const ev=ctx.answered(ok);const evh=ev&&EVT[ev.k]?EVT[ev.k](ev):'';

function startSession(){const due=dueList().map(s=>s.id).slice(0,8);sess={n:0,right:0,mastered:[],reviewed:0,flagged:[],repaired:[],reviews:due,cur:null,curN:0,tried:[],lastKind:null,sinceMix:0,lastMix:null,repTries:{},

  const c=pre.length&&Math.random()<.6?pick(pre):pick(base);sess.lastMix=c;return c}

  if(rep.length){const id=rep[0].id;sess.repTries[id]=(sess.repTries[id]||0)+1;return sess.repTries[id]<=6?{id,kind:'repair',first:sess.repTries[id]===1}:{stop:id}}
  if(quizDue()&&!sess.skipQuiz)return {quiz:true};
  if(sess.n>=sess.max)return null;
  if(!sess.cur||st(sess.cur).lv>0||sess.curN>=8){const r=recommended(sess.tried);sess.cur=r?r.id:null;sess.curN=0;sess.sinceMix=0;if(r)sess.tried.push(r.id)}
  const revs=sess.reviews.filter(isDue);let kind;

  if(kind==='mixed'){sess.sinceMix=0;return {id:pickMix(),kind}}

const accOf=id=>{const s=st(id);return s.a?s.c/s.a:1};

  const recent=Q().recent.filter(id=>pool.includes(id));const others=shuffle(pool.filter(id=>!recent.includes(id))).sort((a,b)=>(st(a).lq||0)-(st(b).lq||0)||accOf(a)-accOf(b));

  for(let i=1;i<ids.length;i++)if(ids[i]===ids[i-1]){const j=ids.findIndex((x,k)=>k>i&&x!==ids[i]);if(j>0)[ids[i],ids[j]]=[ids[j],ids[i]]}
  const items=await Promise.all(ids.map(async id=>({id,q:await fresh(id)})));

  const s=SKM[G.sel],k=nodeState(s.id,recommended());const R=related(s.id);const lk=ids=>ids.length?ids.map(i=>`<button type="button" class="linkish" data-gsel="${i}">${esc(SKM[i].name)}</button>`).join(''):'<span class="none">Nothing. This is a starting point.</span>';
  const label={mastered:'Mastered',due:'Review due',repair:'Needs repair',learning:'Learning',next:'Up next',open:'Ready to start',locked:'Locked'}[k];
  const ac=access(s.id);const nm=ids=>ids.map(p=>esc(SKM[p].name)).join(' and ');
  return `<div class="gcard"><div class="eyebrow">Unit ${s.unit} · ${esc(UNITS.find(u=>u[0]===s.unit)[1])}</div><h3>${esc(s.name)}</h3><span class="pill ${k==='mastered'?'mastered':k==='due'?'due':k==='repair'?'repair':k==='learning'||k==='next'?'learning':''}">${label}</span>
   ${k==='locked'?`<p class="gnote">${ac.why==='pre'?`Opens once you master ${nm(ac.miss)}.`:ac.why==='repair'?`Waiting on a repair of ${nm(ac.rep)}.`:`Waiting for the quiz on ${nm(ac.on)}.`} The notes are open any time.</p>`:''}
   <div class="gcols"><div><div class="eyebrow up">Builds on</div><div class="links">${lk(s.pre)}</div></div><div><div class="eyebrow down">Leads to</div><div class="links">${(KIDS[s.id]||[]).length?lk(KIDS[s.id]):'<span class="none">Nothing yet. This is an end point.</span>'}</div></div></div>
   <p class="gnote">${R.up.size} topic${R.up.size===1?'':'s'} underneath it in total, ${R.down.size} depend${R.down.size===1?'s':''} on it.</p>
   <div class="row"><button class="btn primary" type="button" data-skill="${s.id}">${st(s.id).a?'Practice':'Learn'} this topic</button><button class="btn ghost" type="button" data-gsel="">Clear selection</button></div></div>`}
function drawGraph(keep){const sc=$('#gscroll');if(!sc)return;const l=sc.scrollLeft,t=sc.scrollTop;sc.innerHTML=graphSVG();if(keep){sc.scrollLeft=l;sc.scrollTop=t}
  document.querySelectorAll('.uchip').forEach(b=>b.setAttribute('aria-pressed',String(G.unit===b.dataset.unit)));const d=$('#gdetail');d.innerHTML=detailHTML()}
function fitZoom(){const sc=$('#gscroll');return Math.max(.45,Math.min(1,(sc.clientWidth-4)/LAYOUT.W))}
function mountGraph(){if(G.zoom==null)G.zoom=Math.max(.8,fitZoom());drawGraph(false);
  const sc=$('#gscroll');if(G.zoom>fitZoom()+.01&&!G.sel){const r=recommended();if(r){const p=LAYOUT.xy[r.id];sc.scrollLeft=Math.max(0,p.x*G.zoom-40);sc.scrollTop=Math.max(0,p.y*G.zoom-sc.clientHeight/2)}}}
function selectNode(id){G.sel=G.sel===id?null:id;if(G.sel)G.unit=null;drawGraph(true);if(G.sel&&matchMedia('(max-width:680px)').matches)$('#gdetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){homeMode=m.dataset.mode;try{localStorage.setItem('togisumasu-home-mode',homeMode)}catch(_){}render();return}
  const n=e.target.closest('[data-node]');if(n){selectNode(n.dataset.node);return}
  const g=e.target.closest('[data-gsel]');if(g){G.sel=g.dataset.gsel||null;drawGraph(true);return}
  const u=e.target.closest('[data-unit]');if(u){G.unit=G.unit===u.dataset.unit?null:u.dataset.unit;G.sel=null;drawGraph(true);return}
  const z=e.target.closest('[data-z]');if(z){const sc=$('#gscroll'),old=G.zoom,cx=(sc.scrollLeft+sc.clientWidth/2)/old,cy=(sc.scrollTop+sc.clientHeight/2)/old;
    G.zoom=z.dataset.z==='fit'?fitZoom():Math.max(.35,Math.min(1.6,G.zoom*(z.dataset.z==='in'?1.2:1/1.2)));drawGraph(false);sc.scrollLeft=cx*G.zoom-sc.clientWidth/2;sc.scrollTop=cy*G.zoom-sc.clientHeight/2}});
document.addEventListener('keydown',e=>{const n=e.target.closest&&e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const id=n.dataset.node;selectNode(id);document.querySelector(`[data-node="${id}"]`)?.focus({preventScroll:true})}});
(()=>{let drag=null;document.addEventListener('pointerdown',e=>{const sc=e.target.closest('#gscroll');if(!sc||e.pointerType!=='mouse'||e.target.closest('[data-node]'))return;drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop,sc};sc.classList.add('grab')});
  document.addEventListener('pointermove',e=>{if(!drag)return;drag.sc.scrollLeft=drag.l-(e.clientX-drag.x);drag.sc.scrollTop=drag.t-(e.clientY-drag.y)});
  document.addEventListener('pointerup',()=>{if(drag){drag.sc.classList.remove('grab');drag=null}})})();

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-skill],[data-act],[data-tab]');if(!t)return;
  if(t.dataset.skill){e.preventDefault();const id=t.dataset.skill;go({name:'skill',id,tab:st(id).a>0?'practice':'learn'});return}
  if(t.dataset.tab){go({...view,tab:t.dataset.tab});return}
  const a=t.dataset.act;if(a==='home')go({name:'home'});if(a==='session')startSession();if(a==='quiz')startQuiz();if(a==='another')mountExample()});
$('#homeBtn').onclick=()=>go({name:'home'});
document.addEventListener('click',e=>{const u=e.target.closest('[data-unit-toggle]');if(!u)return;const id=u.dataset.unitToggle;if(collapsedUnits.has(id))collapsedUnits.delete(id);else collapsedUnits.add(id);saveMapPrefs();const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener('change',e=>{if(e.target.id!=='mapFilter')return;mapFilter=e.target.value;saveMapPrefs();const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener('click',e=>{if(e.target.id==='resetBtn'){$('#resetZone').innerHTML='<span class="confirm">Erase all progress? <button class="btn sm" type="button" id="resetYes">Erase</button><button class="btn ghost sm" type="button" id="resetNo">Keep</button></span>'}
  if(e.target.id==='resetNo')renderFoot();if(e.target.id==='resetYes'){Store.data=EMPTY();Store.save();go({name:'home'})}});
document.addEventListener('keydown',e=>{if(!activeQ||!document.querySelector('.qcard #qAct'))return;const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&(tag==='input'||tag==='body'||e.target.id==='qNext')){if(e.target.id==='qNext')return;e.preventDefault();activeQ.done?activeQ.next():activeQ.check()}
  else if(tag!=='input'&&/^[1-4]$/.test(e.key)&&!activeQ.done)activeQ.pick(+e.key-1)});

/* ---------- sign in / create account ---------- */
let REG_OPEN=true,AI_ON=false;
function landingHTML(){
  const join=REG_OPEN?'<button class="btn primary" type="button" data-auth="register">Create account</button>':'';
  const joinNote=REG_OPEN?'':'<p class="authnote" style="margin-top:14px">New accounts are closed on this server. Sign in if you already have one.</p>';
  return `<div class="landing">
    <section class="landing-hero">
      <div class="landing-copy">
        <div class="eyebrow">Mathematics &amp; statistics · mastery practice</div>
        <h1>Sharpen<br>the mind.</h1>
        <p class="landing-lead">A quiet practice room for college-level and postgraduate mathematics and statistics. One idea at a time, worked until it is clear.</p>
        <div class="row landing-actions">
          <button class="btn primary" type="button" data-auth="login">Sign in</button>
          ${join}
          <a class="btn ghost" href="#how">How it works</a>
        </div>
        ${joinNote}
        <p class="landing-meaning"><span class="jp">研ぎ澄ます</span> Togisumasu means “to sharpen the mind.”</p>
      </div>
      <div class="landing-card washi-paper" aria-label="Sample worked example">
        <span class="seal">研</span>
        <div class="eyebrow">A quiet way to practise</div>
        <div class="sample-prompt">Expand and simplify: $$(x+2)(x-3)$$</div>
        <div class="sample-rule"></div>
        <div class="sample-answer"><span>Answer</span> $x^2-x-6$</div>
        <ol class="steps">
          <li>Multiply each term: $x^2-3x+2x-6$.</li>
          <li>Combine like terms: $x^2-x-6$.</li>
        </ol>
        <div class="sample-foot"><span>Algebra</span><span>Mastery</span><span>One idea at a time</span></div>
      </div>
    </section>
    <section class="landing-section" id="how">
      <div class="eyebrow">How it works</div>
      <h2>Practice that stays with you.</h2>
      <p>Short lessons, worked examples, then just enough practice to make the idea stick. The app remembers what needs repair and brings it back at the right moment.</p>
      <div class="landing-features">
        <article class="washi-paper feature"><span class="feature-k">01</span><h3>One idea at a time</h3><p>Read the idea, follow a worked example, then try it yourself. Nothing extra in the way.</p></article>
        <article class="washi-paper feature"><span class="feature-k">02</span><h3>Repair, don't rush</h3><p>When something slips, the app brings it back for two clean answers before you move on.</p></article>
        <article class="washi-paper feature"><span class="feature-k">03</span><h3>Built to grow</h3><p>Starting with algebra and trigonometry, with room for more mathematics and statistics later.</p></article>
      </div>
    </section>
    <section class="landing-close">
      <div class="eyebrow">Begin</div>
      <h2>Come back to the same page tomorrow.</h2>
      <p>Your progress is private, your pace is yours, and the work gets clearer each time.</p>
      <div class="row"><button class="btn primary" type="button" data-auth="login">Sign in</button>${join}</div>
    </section>
    <footer class="landing-foot"><span>Togisumasu · 研ぎ澄ます</span><span>to sharpen the mind</span></footer>
  </div>`;
}
function authHTML(v){const reg=v.mode==='register'&&REG_OPEN;
  return `<div class="authwrap"><section class="authcard washi-paper" aria-labelledby="authTitle">
   <div class="eyebrow">Togisumasu · 研ぎ澄ます</div><h1 id="authTitle">${reg?'Create your account':'Welcome back'}</h1>
   <p class="lead">${reg?'Your progress is saved to your account and only you can see it.':'Sign in to pick up where you left off.'}</p>
   <p class="authnote" style="margin:-8px 0 16px">Togisumasu means “to sharpen the mind.”</p>
   ${REG_OPEN?`<div class="seg" role="tablist" aria-label="Sign in or create an account"><button type="button" role="tab" data-auth="login" aria-selected="${!reg}">Sign in</button><button type="button" role="tab" data-auth="register" aria-selected="${reg}">Create account</button></div>`:''}
   <form class="authform" id="authForm" data-authmode="${reg?'register':'login'}" novalidate>
    ${reg?'<label>Name<input name="fullname" autocomplete="name" maxlength="60" required></label>':''}
    <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label>Password<input name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" minlength="8" required>${reg?'<span style="font-weight:400">At least 8 characters</span>':''}</label>
    <p class="autherr" id="authErr" role="alert">${v.msg?esc(v.msg):''}</p>
    <button class="btn primary" type="submit">${reg?'Create account':'Sign in'}</button>
   </form>
   ${REG_OPEN?'':'<p class="authnote">New accounts are closed on this server. Ask the person who runs it.</p>'}
  </section></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-auth]');if(a)go({name:'auth',mode:a.dataset.auth})});
document.addEventListener('submit',async e=>{if(e.target.id!=='authForm')return;e.preventDefault();
  const f=e.target,mode=f.dataset.authmode,btn=f.querySelector('button[type=submit]'),err=$('#authErr'),val=n=>(f.elements.namedItem(n)||{}).value||'';
  const body={email:val('email').trim(),password:val('password')};if(mode==='register')body.name=val('fullname').trim();
  if(mode==='register'&&!body.name){err.textContent='Enter your name.';return}
  if(!body.email||!body.password){err.textContent='Enter your email and password.';return}
  if(mode==='register'&&body.password.length<8){err.textContent='Use a password of at least 8 characters.';return}
  err.textContent='';btn.disabled=true;btn.textContent=mode==='register'?'Creating account…':'Signing in…';
  try{const r=await API.req('POST','/api/auth/'+mode,body);USER=r.user;await loadCatalog();await Store.load();sess=null;quiz=null;go({name:'home'})}
  catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent=mode==='register'?'Create account':'Sign in'}});
async function logout(){if(Store.dirty)await Store.push();try{await API.req('POST','/api/auth/logout')}catch(e){}
  try{localStorage.removeItem(Store.key())}catch(e){}USER=null;Store.data=EMPTY();sess=null;quiz=null;go({name:'landing'})}
document.addEventListener('click',e=>{if(e.target.id==='logoutBtn')logout()});

/* ---------- account settings ---------- */
function openAccount(){if(!USER)return;const d=$('#accountDlg'),f=$('#accountForm');
  $('#accountEmail').textContent=USER.email;f.reset();f.elements.name.value=USER.name;$('#accountErr').textContent='';
  if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','');f.elements.name.focus()}
document.addEventListener('click',e=>{if(e.target.id==='settingsBtn'){openAccount();return}
  if(e.target.closest('[data-account-close]')){$('#accountDlg').close();return}});
document.addEventListener('submit',async e=>{if(e.target.id!=='accountForm')return;e.preventDefault();
  const f=e.target,err=$('#accountErr'),btn=f.querySelector('button[type=submit]');
  const name=f.name.value.trim(),current=f.current.value,newpass=f.newpass.value,confirm=f.newpass2.value;
  if(!name){err.textContent='Enter your name.';return}
  if(newpass||confirm){
    if(newpass.length<8){err.textContent='Use a password of at least 8 characters.';return}
    if(newpass!==confirm){err.textContent='The new passwords do not match.';return}
    if(!current){err.textContent='Enter your current password to change it.';return}
  }
  err.textContent='';btn.disabled=true;btn.textContent='Saving…';
  try{const body={name};if(newpass){body.currentPassword=current;body.newPassword=newpass}
    const r=await API.req('PATCH','/api/account',body);USER=r.user;renderAcct();$('#accountDlg').close()}
  catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent='Save changes'}});

// AI tutor: the server holds the provider key; the browser only sends the question and the learner's answer.
function aiHTML(t){return esc(t).split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
async function askTutor(btn,out,payload){btn.disabled=true;btn.textContent='Thinking…';
  try{const r=await API.req('POST','/api/ai/explain',payload);
    out.innerHTML=`<div class="aibox" aria-live="polite"><div class="ailabel">AI tutor</div>${aiHTML(r.text)}<div class="aimeta">AI can make mistakes; the worked solution is the reference. ${r.remaining} explanation${r.remaining===1?'':'s'} left today.</div></div>`;
    btn.closest('.row').remove();typeset(out)}
  catch(e){out.innerHTML=`<p class="warn">${esc(e.message)}</p>`;btn.disabled=false;btn.textContent='Try again'}}
async function boot(){
  try{const c=await API.req('GET','/api/auth/config');REG_OPEN=!!c.registration;AI_ON=!!c.ai}catch(e){}
  try{const r=await API.req('GET','/api/auth/me');USER=r.user;await loadCatalog();await Store.load();go({name:'home'})}
  catch(e){USER=null;go({name:'landing'})}}
boot();
</script>
